# Publishes dist/ to the gh-pages BRANCH (not the official Pages artifact API).
# Required repo setting (one time):
#   Settings → Pages → Source: Deploy from a branch
#   Branch: gh-pages / (root)
#
# Do NOT use Source: "GitHub Actions" — that path expects upload-pages-artifact
# and fails with "Multiple artifacts named github-pages".
name: Publish site (gh-pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare SPA output
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Push dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
